    <h1>O jogo da Imitacao</h1>
    <p>alan Turing ajudou a quebrar a maquina enigma sa Segunda Guerra Mundial.</p>

    <div class="cartao"><strong>1912</strong><p>Nasce Alan Turing</p></div>
    <div class="cartao"><strong>1939</strong><p>Alan Turing chega a Bletchley Parck</p></div>
    <div class="cartao"><strong>1950</strong><p>Turing propoes o Teste de Turing</p></div>

    <h2>Teclado da Enigma</h2>
    <div class="teclado">
        <span class="tecla">E</span>
        <span class="tecla">N</span>
        <span class="tecla">I</span>
        <span class="tecla">G</span>

    </div>
